<title>Глоуап до НГ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: одна колонка под телефон — день разбит на карточки «Утро / Пары / День / Дело / Вечер / По графику», нижняя навигация по разделам */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#13202A; --muted:#5B6975; --line:#DCE3E8;
  --accent:#D9621B; --accent-soft:#FCE9DA;
  --pine:#1E6A4B; --pine-soft:#DCEFE5; --on-pine:#FFFFFF;
  --heat0:#E5EBEF; --crit:#B93A33;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D141B; --surface:#152029; --ink:#E6ECF1; --muted:#93A2AE; --line:#24323F;
    --accent:#F08A3E; --accent-soft:#3A2617;
    --pine:#4DBE8A; --pine-soft:#16322A; --on-pine:#0D141B;
    --heat0:#1C2935; --crit:#EE6B62;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D141B; --surface:#152029; --ink:#E6ECF1; --muted:#93A2AE; --line:#24323F;
  --accent:#F08A3E; --accent-soft:#3A2617;
  --pine:#4DBE8A; --pine-soft:#16322A; --on-pine:#0D141B;
  --heat0:#1C2935; --crit:#EE6B62;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 104px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:6px 2px}
.brand{font:700 21px/1.1 var(--f-display);letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
.count{font:500 12.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.banner{margin-block:10px 0;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:13.5px}
.banner.bad{background:color-mix(in srgb,var(--crit) 16%,var(--surface))}
.datebar{display:flex;align-items:center;gap:8px;margin-block:12px 4px}
.datebar .d{flex:1;text-align:center;font-weight:600;min-width:0}
.datebar .d small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.iconbtn{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:12.5px;padding:2px 0}
.hero{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-block:10px}
.ring{display:block}
.ring-bg{fill:none;stroke:var(--heat0);stroke-width:7}
.ring-fg{fill:none;stroke:var(--pine);stroke-width:7;stroke-linecap:round}
.pct{font:700 26px/1 var(--f-display)}
.muted{color:var(--muted);font-size:13px}
.chips{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:6px 0 0;padding:0}
.chips li{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--bg);color:var(--muted)}
.chips b{color:var(--ink);font-weight:500}
.note{font-size:13.5px;color:var(--muted);margin:10px 2px}
.note b{color:var(--ink)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-block:12px;overflow:hidden}
.sec.pad{padding:14px 16px}
.sec h2{font:600 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);padding:15px 16px 8px;margin:0;display:flex;justify-content:space-between;gap:8px}
.sec.pad h2{padding:0 0 10px}
.task{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border-top:1px solid var(--line);min-height:54px}
.sec h2 + .task,.sec h2 + .pair,.sec h2 + .tw > .task{border-top:0}
.hit{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;min-height:30px}
.hit:active{opacity:.7}
.box{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.task.done .box{background:var(--pine);border-color:var(--pine)}
.task.done .box::after{content:"";width:10px;height:5px;border:2.5px solid var(--on-pine);border-top:0;border-right:0;transform:translateY(-2px) rotate(-45deg)}
.task.info .box{border-style:dashed}
.lbl{flex:1;min-width:0}
.lbl small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.task.done .lbl{color:var(--muted)}
.tag{flex:none;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.more{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--muted)}
.more[aria-expanded="true"]{color:var(--ink);border-color:var(--ink)}
.steps{margin:0;padding:0 16px 12px 52px;font-size:13.5px;color:var(--muted)}
.steps li{margin:4px 0}
.inp{flex:none;display:flex;align-items:center;gap:6px}
.inp em{font-style:normal;color:var(--muted);font-size:12.5px}
input[type=text],input[type=time],input[type=date],textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;min-height:40px}
.inp input{width:92px;text-align:right}
.inp input[type=time]{width:104px}
textarea{width:100%;resize:vertical}
.stepper{flex:none;display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1}
.stepper b{min-width:1.5em;text-align:center;font-weight:500}
.pair{display:flex;gap:12px;padding:10px 16px;border-top:1px solid var(--line);align-items:baseline}
.pair .pt{flex:none;width:96px;font-size:12.5px;color:var(--muted)}
.pair .ps{flex:1;min-width:0}
.pair em{font-style:normal;color:var(--muted);font-size:12.5px}
.pair small{display:block;color:var(--muted);font-size:12.5px}
.pair.skip .ps{color:var(--muted)}
.pair.skip small b{color:var(--pine);font-weight:600}
.pair.info .pt{color:var(--ink);font-weight:600}
.flabel{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.padx{padding:0 16px 12px;margin:0}
.h1{font:700 19px/1.2 var(--f-display);margin:14px 0 4px;text-wrap:balance}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 18px;font-weight:600;min-width:64px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.gymhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-block:12px 0}
details.sec summary{cursor:pointer;font-weight:600}
details.sec ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px}
details.inner{padding:0 16px 12px}
details.inner summary{font-size:13px;color:var(--muted);cursor:pointer;padding:6px 0}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-block:12px}
.ex header{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex h3{margin:0;font-size:15.5px;font-weight:600}
.scheme{color:var(--accent);font-size:13px;white-space:nowrap}
.ex p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.ex p.up{color:var(--pine);font-weight:600}
.sets{display:grid;gap:8px;margin-top:10px}
.set{display:flex;align-items:center;gap:8px}
.set .n{width:18px;color:var(--muted);font-size:12.5px}
.set input{width:76px;text-align:right}
.set .x{color:var(--muted);font-size:12.5px}
.primary{display:block;width:100%;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:600;padding:14px;margin-block:14px}
.primary.on{background:var(--pine);color:var(--on-pine)}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px;font-size:13px;text-align:left}
.chip .mono{color:var(--muted);font-size:12px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meals{list-style:none;margin:0;padding:0}
.meals li{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line)}
.meals .mn{flex:1;min-width:0;overflow-wrap:anywhere}
.meals .mv{flex:none;font-size:12.5px;color:var(--muted);text-align:right}
.del{flex:none;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--muted);font-size:16px;line-height:1}
.empty{padding:12px 16px;color:var(--muted);font-size:13.5px;margin:0}
.aiform{display:flex;gap:8px;padding:12px 16px 4px;border-top:1px solid var(--line)}
.aiform input{flex:1;min-width:0}
.aiform button{flex:none;border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;padding:0 14px;min-height:40px}
.aiform button[disabled]{opacity:.5}
.aimsg{padding:2px 16px 6px;font-size:12.5px;color:var(--muted);margin:0}
.mealform{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-top:6px}
.mealform input{width:100%;min-width:0}
.mealform input[name=n]{grid-column:1/-1}
.mealform button{grid-column:1/-1;margin:0;padding:11px}
.meter{position:relative;height:10px;border-radius:99px;background:var(--heat0);overflow:hidden}
.meter .fill{position:absolute;inset:0 auto 0 0;background:var(--pine);border-radius:99px}
.meter .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 45%,transparent)}
.meter.kcal .fill{background:var(--accent)}
.mcap{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin:6px 0 14px}
.mcap b{color:var(--ink);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-block:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.stat b{display:block;font:700 22px/1.1 var(--f-display)}
.stat span{font-size:12.5px;color:var(--muted)}
.stats.s3{grid-template-columns:repeat(3,1fr);gap:8px;margin-top:0}
.stats.s3 .stat{padding:10px}
.stats.s3 .stepper{gap:6px}
.stats.s3 .stepper button{width:32px;height:32px}
.stat .stepper{margin-top:8px}
.stat input{width:100%;margin-top:8px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat .wd{font-size:11px;color:var(--muted);text-align:center}
.cell{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font:500 11.5px var(--f-mono);background:var(--heat0)}
.cell.hi{color:var(--on-pine)}
.cell.future{background:transparent;border:1px dashed var(--line);color:var(--muted)}

<script>
(function(){
const KEY='glowup_os_v2_database';let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){}
const subs=[];
function snapshot(path){const v=state[path];return {id:path.split('/').pop(),exists:v!==undefined,data:()=>JSON.parse(JSON.stringify(v||{}))}}
function notify(path){for(const sub of subs){if(sub.type==='doc'&&sub.path===path)sub.cb(snapshot(path));if(sub.type==='collection'&&path.startsWith(sub.path+'/'))sub.cb(collectionSnap(sub.path));}}
function collectionSnap(path){let docs=Object.keys(state).filter(k=>k.startsWith(path+'/')&&k.slice(path.length+1).indexOf('/')<0).map(k=>snapshot(k));return {docs,metadata:{fromCache:false},docChanges:()=>docs.map(doc=>({type:'added',doc}))}}
const db={doc(path){return {set(data){try{state[path]=JSON.parse(JSON.stringify(data));localStorage.setItem(KEY,JSON.stringify(state));notify(path);return Promise.resolve()}catch(e){return Promise.reject(e)}},onSnapshot(cb){subs.push({type:'doc',path,cb});queueMicrotask(()=>cb(snapshot(path)))}}},collection(path){return {onSnapshot(cb){subs.push({type:'collection',path,cb});queueMicrotask(()=>cb(collectionSnap(path)))}}}};
window.glowDB=db;
window.glowStore={get:()=>JSON.parse(JSON.stringify(state)),replace(obj){state=JSON.parse(JSON.stringify(obj));localStorage.setItem(KEY,JSON.stringify(state));location.reload()},getExtra(){return JSON.parse(localStorage.getItem('glowup_os_v2_extra')||'{}')},setExtra(v){localStorage.setItem('glowup_os_v2_extra',JSON.stringify(v))}};
})();
</script>

/* ---------- сохранение ---------- */
var timers={},inflight={},dirty={},getters={},retried={};
function queueSave(path,get){getters[path]=get;dirty[path]=true;clearTimeout(timers[path]);timers[path]=setTimeout(function(){flush(path);},600);}
function flush(path){
  if(!S.db||inflight[path])return;
  inflight[path]=true;delete dirty[path];
  S.db.doc(path).set(clone(getters[path]())).then(function(){
    inflight[path]=false;retried[path]=0;if(S.saveErr){S.saveErr=null;renderBanner();}
    if(dirty[path])flush(path);
  },function(e){
    inflight[path]=false;
    if(e&&e.code==='unavailable'&&!retried[path]){retried[path]=1;dirty[path]=true;setTimeout(function(){flush(path);},1200+Math.random()*1500);return;}
    S.saveErr=(e&&e.code)||'error';dirty[path]=true;renderBanner();
  });
}
function flushAll(){Object.keys(dirty).forEach(function(p){clearTimeout(timers[p]);flush(p);});}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flushAll();});
window.addEventListener('pagehide',flushAll);
function busy(path){return !!(dirty[path]||inflight[path]);}
function mutDay(d,fn){if(!S.days[d])S.days[d]={done:{},meals:[]};var x=S.days[d];x.done=x.done||{};x.meals=x.meals||[];fn(x);queueSave('days/'+d,function(){return S.days[d];});}
function mutWeek(mon,fn){if(!S.weeks[mon])S.weeks[mon]={};fn(S.weeks[mon]);queueSave('weeks/'+mon,function(){return S.weeks[mon];});}
function mutBiz(fn){var b=clone(S.biz);b.checks=b.checks||{};b.gates=b.gates||{};fn(b);S.biz=b;queueSave('meta/biz',function(){return S.biz;});}

function renderBanner(){

  if(S.saveErr&&S.status!=='nodb'){msg='Последняя отметка не сохранилась. Проверь свободное место и настройки Safari.';bad=true;}

/* ---------- автоподсчёт калорий ---------- */
function aiEstimate(slot,text){
  var d=S.date;
  if(!S.sample){S.aiMsg[slot]='Автоподсчёт здесь недоступен — внеси вручную в «Частое и вручную».';render();return;}
  S.aiBusy[slot]=true;S.aiDraft[slot]=text;S.aiMsg[slot]='Считаю… В первый раз Claude попросит разрешение.';render();
  S.sample.json(AI_PROMPT+text,{modelTier:'quick'}).then(function(res){
    var items=(res&&Array.isArray(res.items))?res.items:[];
    items=items.filter(function(it){return it&&isFinite(+it.kcal);});
    if(!items.length)throw {code:'invalid_json'};
    mutDay(d,function(x){items.forEach(function(it){
      x.meals.push({id:uid(),slot:slot,n:String(it.name||text).slice(0,80),g:num(it.grams),p:Math.round(+it.protein||0),k:Math.round(+it.kcal||0),f:Math.round(+it.fat||0),c:Math.round(+it.carbs||0),at:nowHM(),ai:1});
      var v=Math.round(+it.veg||0);if(v>0)x.veg=(x.veg||0)+v;
    });});
    S.aiDraft[slot]='';
    S.aiMsg[slot]=res.note?('Готово, это оценка. '+String(res.note).slice(0,160)):'Готово, это оценка — проверь цифры.';
  }).catch(function(e){
    var c=e&&e.code;
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].indexOf(c)>=0){S.aiOff=true;S.aiMsg[slot]='';}
    else if(c==='rate_limited')S.aiMsg[slot]='Слишком много запросов. Попробуй через минуту.';
    else if(c==='invalid_json')S.aiMsg[slot]='Не получилось разобрать ответ. Опиши блюдо проще или внеси вручную.';
    else if(c==='session_expired')S.aiMsg[slot]='Нужно заново войти в Claude.';
    else S.aiMsg[slot]='Не вышло посчитать. Попробуй ещё раз.';
  }).then(function(){S.aiBusy[slot]=false;softRender();});
}

/* ---------- события ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.dataset.act;
  if(a==='tab'){S.tab=el.dataset.tab;render();window.scrollTo(0,0);return;}
  if(a==='day'){S.date=add(S.date,+el.dataset.n);render();return;}
  if(a==='today'){S.date=today();render();return;}
  if(a==='more'){S.open[el.dataset.id]=!S.open[el.dataset.id];render();return;}
  if(a==='toggle'){var id=el.dataset.id;mutDay(S.date,function(x){x.done[id]=!x.done[id];});render();return;}
  if(a==='inc'||a==='dec'){var f=el.dataset.field;mutDay(S.date,function(x){x[f]=Math.max(0,(x[f]||0)+(a==='inc'?1:-1));});render();return;}
  if(a==='preset'){var p=PRESETS[+el.dataset.i],sl=el.dataset.slot;mutDay(S.date,function(x){x.meals.push({id:uid(),slot:sl,n:p.n,p:p.p,k:p.k,at:nowHM()});if(p.veg)x.veg=(x.veg||0)+p.veg;});render();return;}
  if(a==='delmeal'){var mid=el.dataset.id;mutDay(S.date,function(x){x.meals=x.meals.filter(function(m){return m.id!==mid;});});render();return;}
  if(a==='gtype'){var t=el.dataset.t;mutDay(S.date,function(x){x.gym=x.gym||{sets:{}};x.gym.type=t;});render();return;}
  if(a==='gdone'){var gt=gymType(S.date);mutDay(S.date,function(x){x.gym=x.gym||{sets:{}};x.gym.type=x.gym.type||gt;x.done.gym=!x.done.gym;});render();return;}
  if(a==='oneoff'){var oid=el.dataset.id,o=clone(S.oneoffs);if(o[oid])delete o[oid];else o[oid]=today();S.oneoffs=o;queueSave('meta/oneoffs',function(){return S.oneoffs;});render();return;}
  if(a==='gymday'){var w=+el.dataset.w,g=(S.settings.gymDays||[]).slice(),ix=g.indexOf(w);if(ix>=0)g.splice(ix,1);else g.push(w);S.settings=Object.assign({},S.settings,{gymDays:g.sort()});queueSave('meta/settings',function(){return S.settings;});render();return;}
  if(a==='bcheck'||a==='gate'){var cid=el.dataset.id,key=a==='bcheck'?'checks':'gates';mutBiz(function(b){if(b[key][cid])delete b[key][cid];else b[key][cid]=today();});render();return;}
  if(a==='binc'||a==='bdec'){var k=el.dataset.k;mutBiz(function(b){b[k]=Math.max(0,(b[k]||0)+(a==='binc'?1:-1));});render();return;}
  if(a==='winc'||a==='wdec'){var wk=el.dataset.k,mon=mondayOf(today());mutWeek(mon,function(x){x[wk]=Math.max(0,(x[wk]||0)+(a==='winc'?1:-1));});render();return;}
});
document.addEventListener('change',function(e){
  var el=e.target,f=el.dataset&&el.dataset.field;if(!f)return;
  if(f==='wake'||f==='bed'){mutDay(S.date,function(x){x[f]=el.value||null;});}
  else if(f==='steps'||f==='weight'||f==='pimples'||f==='waist'||f==='outreach'){mutDay(S.date,function(x){x[f]=num(el.value);});}
  else if(f==='gw'||f==='gr'){
    var ex=el.dataset.ex,i=+el.dataset.i,gt=gymType(S.date);
    mutDay(S.date,function(x){x.gym=x.gym||{sets:{}};x.gym.type=x.gym.type||gt;x.gym.sets=x.gym.sets||{};var arr=x.gym.sets[ex]=x.gym.sets[ex]||[];while(arr.length<=i)arr.push({});var s=Object.assign({},arr[i]);s[f==='gw'?'w':'r']=num(el.value);arr[i]=s;});
  }
  else if(f==='hosp'){S.settings=Object.assign({},S.settings,{hospitalUntil:el.value||''});queueSave('meta/settings',function(){return S.settings;});}
  else if(f==='commute'){var c=num(el.value);S.settings=Object.assign({},S.settings,{commute:c==null?45:Math.max(0,Math.round(c))});queueSave('meta/settings',function(){return S.settings;});}
  else if(f==='usd'){mutBiz(function(b){b.usd=num(el.value);});}
  else return;
  softRender();
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.field==='note'){var v=el.value;mutDay(S.date,function(x){x.note=v;});}
  if(el.name==='q'&&el.form&&el.form.dataset.form==='ai'){S.aiDraft[el.form.dataset.slot]=el.value;}
});
document.addEventListener('submit',function(e){
  var fm=e.target;if(!fm.dataset)return;
  if(fm.dataset.form==='ai'){e.preventDefault();var q=fm.elements.q.value.trim();if(!q){fm.elements.q.focus();return;}if(document.activeElement)document.activeElement.blur();aiEstimate(fm.dataset.slot,q);return;}
  if(fm.dataset.form!=='meal')return;e.preventDefault();
  var n=fm.elements.n.value.trim();if(!n){fm.elements.n.focus();return;}
  var p=num(fm.elements.p.value)||0,k=num(fm.elements.k.value)||0,sl=fm.dataset.slot||'s';
  mutDay(S.date,function(x){x.meals.push({id:uid(),slot:sl,n:n,p:p,k:k,at:nowHM()});});
  if(document.activeElement)document.activeElement.blur();
  render();
});
document.addEventListener('focusout',function(){setTimeout(function(){if(S.needsRender&&!isEditing())render();},0);});

/* ---------- запуск ---------- */
try{render();}catch(e){document.getElementById('view').innerHTML='<section class="sec pad"><h2>Ошибка загрузки</h2><p>'+String(e.message||e)+'</p></section>';console.error(e);}
function use(name){if(name==='db')return window.glowDB;return null;}
Promise.resolve(use('sample')).then(function(fn){S.sample=fn||null;if(!fn)S.aiOff=true;softRender();},function(){S.aiOff=true;softRender();});
Promise.resolve(use('db')).then(function(db){
  if(!db){S.status='nodb';renderBanner();return;}
  S.db=db;
  var timer=setTimeout(function(){if(S.status==='loading'){S.status='slow';renderBanner();}},10000);
  db.collection('days').onSnapshot(function(snap){
    snap.docs.forEach(function(doc){if(busy('days/'+doc.id))return;S.days[doc.id]=clone(doc.data());});
    snap.docChanges().forEach(function(ch){if(ch.type==='removed'&&!busy('days/'+ch.doc.id))delete S.days[ch.doc.id];});
    if(!snap.metadata.fromCache){clearTimeout(timer);if(S.status!=='error')S.status='ok';}
    softRender();
  },function(){clearTimeout(timer);S.status='error';renderBanner();});
  db.collection('weeks').onSnapshot(function(snap){snap.docs.forEach(function(doc){if(busy('weeks/'+doc.id))return;S.weeks[doc.id]=clone(doc.data());});softRender();},function(){});
  db.doc('meta/settings').onSnapshot(function(s){if(busy('meta/settings'))return;if(s.exists){S.settings=Object.assign(clone(DEF_SETTINGS),clone(s.data()));}softRender();},function(){});
  db.doc('meta/oneoffs').onSnapshot(function(s){if(busy('meta/oneoffs'))return;S.oneoffs=s.exists?clone(s.data()):{};softRender();},function(){});
  db.doc('meta/biz').onSnapshot(function(s){if(busy('meta/biz'))return;var b=s.exists?clone(s.data()):{};b.checks=b.checks||{};b.gates=b.gates||{};S.biz=b;softRender();},function(){});
},function(){S.status='nodb';renderBanner();});
})();
</script>

let data;try{data=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}if(!data||!Array.isArray(data.tasks))data={tasks:initial,notes:{}};
let mode='tasks',date=new Date().toLocaleDateString('en-CA');if(!/^\d{4}-\d{2}-\d{2}$/.test(date))date=new Date().toISOString().slice(0,10);

function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function getReport(n){let db=window.glowStore.get(),days=Object.keys(db).filter(k=>k.startsWith('days/')).sort();let start=dateAdd(date,1-n),selected=days.filter(k=>k.slice(5)>=start&&k.slice(5)<=date);let tasks=data.tasks.filter(t=>t.date>=start&&t.date<=date);let lines=['GLOWUP OS — отчёт '+start+' — '+date,'Задачи ('+tasks.filter(t=>t.done).length+'/'+tasks.length+'):'];tasks.forEach(t=>lines.push((t.done?'[x] ':'[ ] ')+t.date+' · '+t.category+' · '+t.text));lines.push('\nЗаметки:');Object.keys(data.notes).sort().filter(d=>d>=start&&d<=date).forEach(d=>lines.push(d+': '+data.notes[d]));lines.push('\nДанные основного трекера:');selected.forEach(k=>lines.push(k.slice(5)+': '+JSON.stringify(db[k])));lines.push('\nПрогресс бизнес-плана: '+JSON.stringify(db['meta/biz']||{}));lines.push('\nПроанализируй выполнение и предложи изменения с учётом исходного плана. Если предлагаешь пакет задач, верни JSON вида {"tasks":[{"id":"...","date":"YYYY-MM-DD","category":"...","text":"...","due":"YYYY-MM-DD"}]}');return lines.join('\n')}
return {open(m){mode=m;document.getElementById('glow-extra').classList.add('active');render()},close(){document.getElementById('glow-extra').classList.remove('active')},move(n){date=dateAdd(date,n);render()},today(){date=new Date().toLocaleDateString('en-CA');render()},setDate(v){date=v;render()},check(id,v){let t=data.tasks.find(t=>t.id===id);if(t){t.done=v;t.completedAt=v?new Date().toISOString():null;save();render()}},add(){let text=document.getElementById('newTask').value.trim();if(!text)return;data.tasks.push({id:'u'+Date.now(),date,category:document.getElementById('newCategory').value,text,done:false});save();render()},note(v){data.notes[date]=v;save()},edit(id){let t=data.tasks.find(t=>t.id===id);if(!t)return;let text=prompt('Изменить задачу',t.text);if(text===null)return;if(!text.trim()){if(confirm('Удалить задачу?'))data.tasks=data.tasks.filter(x=>x.id!==id)}else{t.text=text.trim();let newDate=prompt('Дата задачи ГГГГ-ММ-ДД',t.date);if(newDate&&/^\d{4}-\d{2}-\d{2}$/.test(newDate))t.date=newDate;}save();render()},async copyReport(n){let r=getReport(n);try{await navigator.clipboard.writeText(r);alert('Отчёт скопирован. Вставь его в наш чат ChatGPT.')}catch(e){prompt('Скопируй текст отчёта',r)}},importTasks(){try{let p=JSON.parse(document.getElementById('syncPaste').value),tasks=p.tasks;if(!Array.isArray(tasks)||tasks.length>200||tasks.some(t=>typeof t.text!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(t.date)||typeof t.category!=='string'))throw Error('Неверный формат задач');if(!confirm('Добавить/обновить '+tasks.length+' задач?'))return;for(let t of tasks){let existing=data.tasks.find(x=>x.id===t.id);if(existing)Object.assign(existing,{text:t.text,date:t.date,category:t.category,due:t.due||existing.due});else data.tasks.push({id:t.id||'imp'+Date.now()+Math.random().toString(36).slice(2),date:t.date,category:t.category,text:t.text,due:t.due||'',done:false})}save();alert('Задачи обновлены');mode='tasks';render()}catch(e){alert('Не удалось применить пакет: '+e.message)}},backup(){download('glowup-backup-'+date+'.json',JSON.stringify({format:'glowup-os-backup-v1',database:window.glowStore.get(),extra:data,exportedAt:new Date().toISOString()},null,2),'application/json')},async restore(file){if(!file)return;try{let b=JSON.parse(await file.text());if(b.format!=='glowup-os-backup-v1'||!b.database||!b.extra||!Array.isArray(b.extra.tasks))throw Error('Неподходящий файл');if(!confirm('Заменить ВСЕ текущие данные резервной копией?'))return;localStorage.setItem(KEY,JSON.stringify(b.extra));window.glowStore.replace(b.database)}catch(e){alert('Ошибка восстановления: '+e.message)}},calendar(){let ts=data.tasks.filter(t=>!t.done),fmt=x=>x.replaceAll('-',''),ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//GlowUp OS//RU'];ts.forEach(t=>{let d=fmt(t.date),end=fmt(dateAdd(t.date,1));ics.push('BEGIN:VEVENT','UID:'+t.id+'@glowup.local','DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+end,'SUMMARY:'+t.text.replace(/[\\,;]/g,' '),'DESCRIPTION:'+t.category,'END:VEVENT')});ics.push('END:VCALENDAR');download('glowup-calendar.ics',ics.join('\r\n'),'text/calendar')}};

<div id="g3" aria-label="GlowUp OS"></div><nav id="g3nav" aria-label="Навигация"><button data-page="today" class="sel" onclick="G3.page('today')"><span class="symbol">⌂</span>Сегодня</button><button data-page="plan" onclick="G3.page('plan')"><span class="symbol">▦</span>План</button><button data-page="projects" onclick="G3.page('projects')"><span class="symbol">◈</span>Проекты</button><button data-page="more" onclick="G3.page('more')"><span class="symbol">•••</span>Ещё</button></nav><div id="g3overlay"><div class="sheet"><h2>Новая задача</h2><input id="g3tasktext" placeholder="Что нужно сделать?" maxlength="240"><input id="g3taskdate" type="date"><select id="g3taskcat"><option>Личное</option><option>Учёба</option><option>Агент</option><option>Музыка</option><option>Бизнес</option><option>Здоровье</option><option>Уход</option></select><div class="buttons"><button class="cancel" onclick="G3.close()">Отмена</button><button class="save" onclick="G3.add()">Добавить</button></div></div></div><script>
const G3=(()=>{
 const KEY='glowup_os_v2_extra',DB='glowup_os_v2_database';let page='today',chosen=localDate(),refreshTimer;
 function localDate(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
 function plus(d,n){const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return localDate(x)}
 function get(){try{let d=JSON.parse(localStorage.getItem(KEY)||'{}');return Array.isArray(d.tasks)?d:{tasks:[],notes:{}}}catch(e){return {tasks:[],notes:{}}}}
 function set(d){localStorage.setItem(KEY,JSON.stringify(d));render()}
 function base(){try{return JSON.parse(localStorage.getItem(DB)||'{}')}catch(e){return {}}}
 function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function head(label,title,sub){return `<div class="topline"><div class="brand">glowup<span>.os</span></div><div class="ver">GLASS · 3.0.1</div></div><div class="eyebrow">${label}</div><h1>${title}</h1><p class="subtitle">${sub}</p>`}
 function row(t){return `<div class="taskrow ${t.done?'done':''}"><button class="check ${t.done?'on':''}" aria-label="${t.done?'Отменить':'Выполнить'}" onclick="G3.toggle('${esc(t.id)}')">${t.done?'✓':''}</button><div class="txt">${esc(t.text)}<small>${esc(t.category||'Задача')}${t.due?' · до '+esc(t.due.slice(5)):''}</small></div></div>`}
 function tasks(date,limit){let a=get().tasks.filter(t=>t.date===date).sort((a,b)=>Number(a.done)-Number(b.done));return {items:a,html:a.length?a.slice(0,limit||99).map(row).join(''):'<div class="empty">Пока нет задач. Добавь первую одним нажатием.</div>'}}
 function coreCount(){let b=base(),d=b['days/'+localDate()]||{};return {done:Object.values(d.done||{}).filter(Boolean).length,meals:(d.meals||[]).length,protein:(d.meals||[]).reduce((s,x)=>s+(Number(x.p)||0),0)}}
 function today(){const d=localDate(),ts=tasks(d,4),ct=coreCount(),all=get().tasks.filter(t=>!t.done&&t.date>=d).sort((a,b)=>a.date.localeCompare(b.date));let focus=all[0];let title=focus?esc(focus.text):'Выбери главное на сегодня';let hint=focus?'Ближайшая задача · '+esc(focus.category):'Одна важная задача лучше длинного списка';return head('ТВОЙ ДЕНЬ',new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long'}).format(new Date()),'Меньше шума. Больше сделанного.')+`<section class="focus"><div class="eyebrow">ФОКУС</div><h2>${title}</h2><p>${hint}</p></section><div class="rowhead"><h2>Быстрые действия</h2></div><div class="quick"><button onclick="G3.open()"><span class="ico">＋</span>Задача</button><button onclick="G3.legacy('food')"><span class="ico">◫</span>Еда</button><button onclick="G3.legacy('gym')"><span class="ico">⌁</span>Тренировка</button></div><div class="rowhead"><h2>Задачи сегодня</h2><button class="link" onclick="G3.page('plan')">Все задачи ›</button></div><div class="tasks">${ts.html}</div><div class="rowhead"><h2>Мой день</h2></div><div class="mini"><div class="metric"><strong>${ct.protein} г</strong><small>Белок · ${ct.meals} записей</small></div><div class="metric"><strong>${ct.done}</strong><small>Отмечено привычек</small></div></div><div class="footerhint">Данные хранятся на этом iPhone. Резервная копия — в разделе «Ещё».</div>`}
 function plan(){let ts=tasks(chosen);let days=Array.from({length:7},(_,i)=>plus(localDate(),i-1));return head('РАСПИСАНИЕ','План','Дела и заметки по дням.')+`<div class="daystrip">${days.map(d=>`<button class="${chosen===d?'sel':''}" onclick="G3.date('${d}')">${new Intl.DateTimeFormat('ru-RU',{weekday:'short'}).format(new Date(d+'T12:00:00'))}<br><b>${Number(d.slice(-2))}</b></button>`).join('')}</div><div class="rowhead"><h2>${new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long'}).format(new Date(chosen+'T12:00:00'))}</h2><button class="link" onclick="G3.open()">＋ Добавить</button></div><div class="tasks">${ts.html}</div><div class="rowhead"><h2>Заметки</h2></div><textarea class="note" id="g3notes" placeholder="Мысли, итоги, идеи…" oninput="G3.note(this.value)">${esc(get().notes?.[chosen]||'')}</textarea><div class="card"><h3>Учёба и расписание</h3><p>Расписание пар, числитель и знаменатель, переносы.</p><button class="secondary" onclick="G3.legacy('plan')">Открыть расписание ›</button></div>`}
 function projects(){let all=get().tasks.filter(t=>!t.done&&['Музыка','Бизнес','Агент'].includes(t.category)).sort((a,b)=>a.date.localeCompare(b.date));return head('ДВИЖЕНИЕ ВПЕРЁД','Проекты','Музыка, продажи и агент — в одном месте.')+`<div class="focus"><div class="eyebrow">БЛИЖАЙШАЯ ЦЕЛЬ</div><h2>Подготовить продажи битов</h2><p>Контрольная точка · 15 ноября</p></div><div class="rowhead"><h2>Следующие шаги</h2><button class="link" onclick="G3.open()">＋ Задача</button></div><div class="tasks">${all.length?all.slice(0,6).map(row).join(''):'<div class="empty">Нет активных задач проектов.</div>'}</div><div class="card"><h3>Бизнес-план и этапы</h3><p>Лупмейкеры, дуо-биты, предложения A/B и воронка продаж.</p><button class="secondary" onclick="G3.legacy('biz')">Открыть бизнес-план ›</button></div>`}
 function more(){return head('НАСТРОЙКИ И РАЗДЕЛЫ','Моё','Все инструменты без лишнего на главном экране.')+`<div class="card"><h3>Здоровье и привычки</h3><button class="sectionlink" onclick="G3.legacy('today')">Уход и ежедневные привычки <span>›</span></button><button class="sectionlink" onclick="G3.legacy('food')">Питание и белок <span>›</span></button><button class="sectionlink" onclick="G3.legacy('gym')">Тренировки <span>›</span></button><button class="sectionlink" onclick="G3.legacy('progress')">Аналитика и прогресс <span>›</span></button></div><div class="card"><h3>Система</h3><button class="sectionlink" onclick="G3.extra('sync')">ChatGPT и резервные копии <span>›</span></button><button class="sectionlink" onclick="G3.extra('tasks')">Полный менеджер задач <span>›</span></button><button class="sectionlink" onclick="G3.legacy('plan')">Настройки плана <span>›</span></button></div><div class="footerhint">GlowUp OS · 3.0.1 · интерфейс для iPhone. Никакой платной подписки.</div>`}
 function render(){document.getElementById('g3').innerHTML=({today,plan,projects,more}[page])();document.querySelectorAll('#g3nav button').forEach(b=>b.classList.toggle('sel',b.dataset.page===page))}
 function legacy(tab){let overlay=document.getElementById('g3legacy');if(!overlay){overlay=document.createElement('div');overlay.id='g3legacy';overlay.style.cssText='position:fixed;inset:0;z-index:85;background:#0b101a;overflow:auto;padding:calc(env(safe-area-inset-top) + 62px) 14px calc(env(safe-area-inset-bottom) + 30px)';overlay.innerHTML='<button id="g3back" onclick="G3.back()" style="position:fixed;z-index:90;top:calc(env(safe-area-inset-top) + 8px);left:16px;background:#293d58;color:white;border:1px solid #526783;border-radius:18px;padding:12px 20px;font-size:15px">‹ Назад</button><div id="g3old"></div>';document.body.appendChild(overlay)}overlay.style.display='block';let b=document.querySelector('.tabs button[data-tab="'+tab+'"]');if(b)b.click();let view=document.getElementById('view');view.style.cssText='display:block!important;max-width:620px;margin:auto;padding:30px 0 50px;color:#17253b';document.getElementById('g3old').appendChild(view);document.getElementById('g3').style.display='none';document.getElementById('g3nav').style.display='none';}
 function back(){let v=document.getElementById('view');document.querySelector('.wrap').appendChild(v);v.style.display='none';document.getElementById('g3legacy').style.display='none';document.getElementById('g3').style.display='block';document.getElementById('g3nav').style.display='grid';render()}
 return {page(p){page=p;render();window.scrollTo(0,0)},date(d){chosen=d;render()},toggle(id){let d=get(),t=d.tasks.find(x=>x.id===id);if(t){t.done=!t.done;t.completedAt=t.done?new Date().toISOString():null;set(d)}},note(v){let d=get();d.notes=d.notes||{};d.notes[chosen]=v;localStorage.setItem(KEY,JSON.stringify(d))},open(){document.getElementById('g3overlay').classList.add('open');document.getElementById('g3taskdate').value=page==='plan'?chosen:localDate();document.getElementById('g3tasktext').focus()},close(){document.getElementById('g3overlay').classList.remove('open')},add(){let t=document.getElementById('g3tasktext').value.trim(),date=document.getElementById('g3taskdate').value;if(!t||!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(date))return alert('Укажи задачу и дату');let d=get();d.tasks.push({id:'g3-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),date,category:document.getElementById('g3taskcat').value,text:t,done:false});set(d);this.close();document.getElementById('g3tasktext').value=''},legacy,back,extra(m){if(window.GlowExtra){GlowExtra.open(m);document.getElementById('glow-extra').style.zIndex='110'}},render}
})();G3.render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)G3.render()});
</script></body></html>
